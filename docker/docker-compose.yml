# AI 私厨 - 一键部署（阶段 6）：pgvector + redis + api + nginx 四容器
# 用法（在项目根目录执行）：
#   一键起：docker compose -f docker/docker-compose.yml up -d --build
#   看状态：docker compose -f docker/docker-compose.yml ps
#   停止：docker compose -f docker/docker-compose.yml stop
#   彻底删除容器（数据卷保留）：docker compose -f docker/docker-compose.yml down

services:
  pgvector:
    # pgvector 官方镜像 = PostgreSQL 16 + 预装 pgvector 向量扩展
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/pgvector:v0.7.0
    container_name: ai_sichu_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_sichu
      POSTGRES_PASSWORD: ai_sichu
      POSTGRES_DB: ai_sichu
    ports:
      # 宿主机端口:容器端口。本地开发的后端也连这个库，所以必须映射出来
      - "5432:5432"
    volumes:
      # 命名数据卷：容器删了数据也在
      - ai_sichu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_sichu -d ai_sichu"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # 阶段 4 新增：限流计数 + JWT 黑名单 都存这里
    # DaoCloud 镜像源（Docker Hub 国内拉不动）
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: ai_sichu_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ai_sichu_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # 阶段 6 新增：后端 FastAPI 容器
    build:
      context: ..                  # 构建上下文 = 项目根目录（.dockerignore 也在那里生效）
      dockerfile: docker/api.Dockerfile
    container_name: ai_sichu_api
    restart: unless-stopped
    env_file:
      - ../.env                    # 密钥从 .env 注入，不打进镜像
    environment:
      #  覆盖 .env 里的地址：容器内连数据库/缓存要用 compose 服务名，不是 localhost
      - DATABASE_URL=postgresql+psycopg2://ai_sichu:ai_sichu@pgvector:5432/ai_sichu
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      pgvector: { condition: service_healthy }   # 等数据库健康了再起 api
      redis:    { condition: service_healthy }
    healthcheck:
      # python:3.13-slim 里没有 curl，用 python 自己做健康检查
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    # 注意：不映射 8002 到宿主机 —— 对外只有 nginx 80 一个入口，
    # 也避免和本地开发的后端（也在 8002）打架

  nginx:
    # 阶段 6 新增：网关 + 前端静态文件服务
    image: docker.m.daocloud.io/library/nginx:alpine
    container_name: ai_sichu_nginx
    restart: unless-stopped
    ports:
      - "8001:80"                   # 对外唯一入口（宿主机 80 被 IIS 占用，用 8001）
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro          # 配置只读挂载
      - ../frontend:/usr/share/nginx/html:ro           # 前端文件只读挂载（改前端不用重建镜像）
    depends_on:
      - api

volumes:
  ai_sichu_pgdata:
  ai_sichu_redisdata: