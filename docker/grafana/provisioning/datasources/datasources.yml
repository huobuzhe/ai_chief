# 阶段 7：Grafana 自动数据源
# uid 必须与仪表盘 JSON 里 datasource.uid 完全一致，否则面板报 "Datasource not found"
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
