# docker/nginx.conf - AI 私厨网关（阶段 6）

worker_processes auto;              # 几个 CPU 核就开几个工作进程

events {
    worker_connections 1024;        # 每个工作进程最多同时 hold 1024 个连接
}

http {
    include /etc/nginx/mime.types;  # 文件后缀 → Content-Type 对照表（js/css/图片等）
    default_type application/octet-stream;
    sendfile on;                    # 静态文件零拷贝传输，省 CPU
    keepalive_timeout 65;           # 连接保持 65 秒，同一用户连续请求不重复握手

    # 上游：api 容器（compose 服务名 api，容器内端口 8002）
    upstream backend {
        server api:8002;
    }

    server {
        listen 80;                  # 监听 80 端口（http 默认端口，URL 里不用写）
        client_max_body_size 10m;   # 请求体上限（防超大请求拖垮服务）

        # 前端静态文件：宿主机 frontend/ 目录挂载到容器这里
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;   # 找不到的路径都回首页（单页应用惯例）
        }

        # 后端接口：反代到 api 容器
        location ~ ^/(auth|users|chat|oss|health|docs|redoc|openapi\.json) {
            proxy_pass http://backend;                     # 转发给 upstream backend
            proxy_set_header Host $host;                   # 把原始 Host 传过去
            proxy_set_header X-Real-IP $remote_addr;       # 用户真实 IP（限流靠它）
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # 代理链
            proxy_set_header X-Forwarded-Proto $scheme;    # 原始协议

            #  流式对话关键：关缓冲。不关的话 nginx 会攒够一大块再发，前端看不到逐段输出
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;   # LLM 生成慢，给足 5 分钟
        }
    }
}