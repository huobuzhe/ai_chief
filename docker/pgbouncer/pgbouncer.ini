; PgBouncer 主配置——"数据库连接的收发室"
; 两个段：[databases] 告诉它后端真库在哪；[pgbouncer] 是它自己的行为规则
[databases]
;                 连接串里写 "ai_sichu" 时，实际转发给 pgvector 容器的 5432
ai_sichu = host=pgvector port=5432 dbname=ai_sichu user=ai_sichu password=ai_sichu

[pgbouncer]
listen_addr = 0.0.0.0          
; 监听所有网卡（容器里必须 0.0.0.0，宿主机才能连）
listen_port = 6432             
; 容器内端口（宿主机映射成 9432）

auth_type = plain              
; 明文密码校验（账号密码写 userlist.txt）
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction        
; 池化粒度：事务级（一个真实连接按"事务"借还）
max_client_conn = 100          
; 最多接 100 个客户端连接（应用侧不用抢）
default_pool_size = 20         
; 每个数据库维持 20 个真实连接
reserve_pool_size = 5          
; 高峰时最多再加 5 个应急连接
reserve_pool_timeout = 3       
; 排队超过 3 秒才启用应急池

server_reset_query = DISCARD ALL   
; 归还连接前清掉会话级残留状态（事务池化必配）
ignore_startup_parameters = extra_float_digits

admin_users = ai_sichu         
; 允许这个账号连 "pgbouncer" 库执行 SHOW POOLS 看池子状态

logfile = /dev/stdout          
; 日志打到容器标准输出（docker logs 直接看）